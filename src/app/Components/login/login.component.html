<div class="login-wrapper">
  <div class="login-container">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Enter username" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter password 6 digits" required />
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p *ngIf="message" class="message">{{ message }}</p>

    <p class="register-link">Don't have an account? <a routerLink="/register">Sign Up</a></p>
  </div>
</div>
